name: Deploy static site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Validate committed release
        run: |
          node --check data/detailed-learning.js
          node --check years-topics.js
          node tools/build-year-topics.js --check
          node tools/year-explanations-smoke.js
          node --check water-topics.js
          node tools/build-pakistan-water-topics.js --check
          node tools/build-pakistan-articles-topics.js --check
          node --check prime-ministers.js
          node tools/build-prime-ministers.js --check
          node tools/build-presidents.js --check
          node tools/validate-wgi.js --complete
          node tools/validate-site-data.js --expected=11952
          node tools/validate-world-map-data.js
          node --check world-map.js
          node --check organizations-topics.js
          node tools/current-affairs-smoke.js
          node tools/answer-text-migration-smoke.js

      - name: Validate authentication and cloud sync
        run: |
          node --check firebase-config.js
          node --check firebase-sync.js
          node --check app.js
          node tools/popup-preference-smoke.js
          node tools/wrong-quiz-smoke.js
          node tools/cloud-sync-smoke.js
          node tools/category-progress-smoke.js

      - name: Prepare static site
        run: |
          mkdir -p _site/data _site/assets/fonts _site/assets/maps
          cp index.html styles.css app.js world-map.js organizations-topics.js firebase-config.js firebase-sync.js _site/
          cp theme.js years-topics.js _site/
          cp water-topics.js _site/
          cp prime-ministers.js _site/
          cp data/questions.js data/gk-study-notes.js data/detailed-learning.js _site/data/
          cp data/year-topics.js _site/data/
          cp data/pakistan-water-topics.js _site/data/
          cp data/pakistan-articles-topics.js _site/data/
          cp data/prime-ministers.js _site/data/
          cp data/presidents.js _site/data/
          cp data/organizations-topics.js _site/data/
          cp assets/fonts/*.woff2 _site/assets/fonts/
          cp assets/maps/world-countries-50m.geojson _site/assets/maps/

      - name: Upload static site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
